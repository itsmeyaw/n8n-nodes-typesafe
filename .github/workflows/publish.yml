name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node --print "require('./package.json').version")"
          test "$tag_version" = "$package_version"
      - run: pnpm test
      - run: pnpm lint
      - name: Verify npm publish prerequisites
        run: RELEASE_MODE=true npm publish --dry-run --provenance
      # In GitHub Actions, n8n-node release skips release-it and only runs
      # lint, build, and npm publish with RELEASE_MODE and provenance enabled.
      - name: Publish with npm trusted publishing
        run: pnpm exec n8n-node release
      - name: Verify published version and provenance
        env:
          PACKAGE_NAME: '@itsmeyaw/n8n-nodes-typesafe'
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          for attempt in $(seq 1 10); do
            if test "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json)" = "\"$PACKAGE_VERSION\""; then
              break
            fi
            test "$attempt" = 10 && exit 1
            sleep 6
          done

          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          npm install --prefix "$verification_dir" --ignore-scripts --omit=peer "$PACKAGE_NAME@$PACKAGE_VERSION"
          for attempt in $(seq 1 10); do
            if npm audit signatures --prefix "$verification_dir" --json --include-attestations > "$verification_dir/signatures.json" && node -e 'const report = require(process.argv[1]); const verified = report.verified?.some(({ name, version, attestations }) => name === process.env.PACKAGE_NAME && version === process.env.PACKAGE_VERSION && attestations?.provenance?.predicateType === "https://slsa.dev/provenance/v1"); process.exit(verified ? 0 : 1)' "$verification_dir/signatures.json"; then
              exit 0
            fi
            test "$attempt" = 10 && exit 1
            sleep 6
          done
